name: Build & deploy Solaris Times
on:
  push: { branches: [main] }
  schedule: [{ cron: "1 6 * * *" }]   # 09:01 Europe/Moscow — снимает эмбарго с подготовленного номера
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: rm -rf issues index.html archive issues.json && python3 build.py
      - run: mkdir _site && cp -r index.html issues archive issues.json assets .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
