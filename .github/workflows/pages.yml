name: Build & deploy Solaris Times
on:
  push: { branches: [main] }
  schedule: [{ cron: "1 18 * * 0" }]   # воскресенье 21:01 Europe/Moscow (18:01 UTC) — снимает эмбарго с еженедельного номера
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright pymupdf && python -m playwright install --with-deps chromium
      # issues/ is generated, except print-only filler pools (issues/<date>/fillers.json).
      - run: |
          mkdir -p /tmp/st-fillers
          if [ -d issues ]; then
            find issues -name fillers.json -type f | while read -r f; do
              rel="${f#issues/}"
              mkdir -p "/tmp/st-fillers/$(dirname "$rel")"
              cp "$f" "/tmp/st-fillers/$rel"
            done
          fi
          rm -rf issues index.html archive issues.json
          mkdir -p issues
          cp -a /tmp/st-fillers/. issues/ 2>/dev/null || true
          python3 build.py
      - run: mkdir _site && cp -r index.html issues archive issues.json assets .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
